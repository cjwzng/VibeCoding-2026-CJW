
    <!-- 연혁 다음 현직자 인터뷰 섹션 -->
    <section class="worker" id="worker" aria-labelledby="worker-title">
      <div class="worker__inner">

        <!-- 제목 + 로고 + 캐릭터 -->
        <header class="worker__head">
          <div class="worker__headline">
            <img class="worker__logo" src="images/con3_logo_png.png" alt="Hanmi" width="216" height="193">
            <h2 class="worker__title" id="worker-title">한미에서는 어떤 일을 할까요?</h2>
          </div>
          <p class="worker__desc">일의 보람부터 성장의 순간까지, 먼저 경험한 현직자들이 솔직하게 들려드립니다.</p>
        </header>
        <img class="worker__char" src="images/con3_char_png.png" alt="서류가방을 들고 출근하는 보라색 캐릭터" width="560" height="458">

        <!-- 현직자 카드 -->
        <ul class="worker__list">
          <li class="worker__card">
            <figure class="worker__photo">
              <img class="worker__img" src="images/con3_int1_jpg.png" alt="연구실에서 주먹을 쥐어 보이며 웃고 있는 한미약품 품질관리 이건호 사원" width="1100" height="706">

            </p>
            <div class="worker__meta">
              <p class="worker__info">
                <span class="worker__team">한미약품 품질관리</span>
                <span class="worker__sep" aria-hidden="true"></span>
                <span class="worker__name">이건호 사원</span>
              </p>
              <a class="worker__link" href="#worker-interview-1" aria-label="한미약품 품질관리 이건호 사원 인터뷰 보기">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </a>
            </div>
          </li>

          <li class="worker__card">
            <figure class="worker__photo">
              <img class="worker__img" src="images/con3_int2_jpg.png" alt="소파에 앉아 미소 짓고 있는 한미약품 전임상연구 박진하 연구원" width="1100" height="706">
            </figure>
            <p class="worker__text">
              <span class="worker__line">신약 후보물질의 가능성을 과학적으로 검증해</span>
              <span class="worker__line">새로운 치료제가 환자에게 향하는 첫걸음을 만듭니다.</span>
            </p>
            <div class="worker__meta">
              <p class="worker__info">
                <span class="worker__team">한미약품 전임상연구</span>
                <span class="worker__sep" aria-hidden="true"></span>
                <span class="worker__name">박진하 연구원</span>
              </p>
              <a class="worker__link" href="#worker-interview-2" aria-label="한미약품 전임상연구 박진하 연구원 인터뷰 보기">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </a>
            </div>
          </li>
        </ul>

        <!-- 전체 현직자 보기 -->
        <div class="worker__more">
          <a class="btn-cta worker__cta" href="#worker-all">모든 현직자 알아가기!</a>
        </div>

        <!-- 약병 오브제 (모바일 시안에는 없음) -->
        <img class="worker__bottle" src="images/con3_bottle_png.png" alt="한미 로고가 붙은 파란색 약병" width="442" height="692">
