<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026년 하반기 한미그룹 공개채용</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <style>
    /* ===== Design Tokens ===== */
    /* CSS 변수구역 */
    /* :root{변수코드} 
       1. 변수설정 방법
       --변수명: 값;
       변수명은 케밥케이스로 주로 씀
       (케밥케이스란? 마이너스 기호로 연결된 볍수법)
       2. 변수호출 방법
        var(변수명)
        쓰고 싶은 곳에 값으로 변수를 사용함
    */
    :root {
      --red: #E60012;
      --red-grad-end: #FF5D32;
      --black: #000000;
      --white: #FFFFFF;
      --font: 'Inter', 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      --ease: 0.2s ease;
      --wrap: 1440px;
      --gnb-h: 100px;
    }

    /* ===== Reset ===== */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      color: var(--black);
      background: var(--white);
      -webkit-font-smoothing: antialiased;
      min-width: 0;
    }
    h1, p, ul { margin: 0; padding: 0; }
    ul { list-style: none; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; border: 0; padding: 0; background: none; cursor: pointer; }
    img { display: block; border: 0; }
    :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }

    /* ===== Header ===== */
    .header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: var(--gnb-h);
      z-index: 10;
    }
    .header__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: var(--wrap);
      height: 100%;
      margin: 0 auto;
      padding: 0 60px;
    }
    .logo { display: block; width: 182px; height: 31px; flex: none; }
    .logo img { width: 182px; height: 31px; }

    .header__right { display: flex; align-items: center; height: 100%; }
    .gnb { height: 100%; }
    .gnb__list { display: flex; gap: 40px; height: 100%; }
    .gnb__item { display: flex; height: 100%; }
    .gnb__link {
      display: flex;
      align-items: center;
      height: 100%;
      font-weight: 600;
      font-size: 19.1px;
      line-height: 20px;
      letter-spacing: -0.4px;
      color: var(--black);
      white-space: nowrap;
      transition: color var(--ease);
    }
    .gnb__item:first-child .gnb__link { font-size: 19.4px; }
    .gnb__link:hover { color: var(--red); }

    /* 지원하기 버튼 */
    .apply { padding-left: 40px; flex: none; }
    .btn-apply {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 119px;
      height: 48px;
      padding: 13.5px 20px 14.5px;
      border-radius: 500px;
      background: var(--red);
      color: var(--white);
      font-weight: 600;
      font-size: 17.4px;
      line-height: 18px;
      letter-spacing: -0.36px;
      white-space: nowrap;
      box-shadow: inset 0 0 0 2px var(--red);
      transition: background-color var(--ease), color var(--ease);
    }
    .btn-apply svg { width: 7px; height: 12px; flex: none; }
    .btn-apply:hover { background: var(--white); color: var(--red); }

    /* ===== Main Visual ===== */
    .main-visual {
      position: relative;
      height: 900px;
      min-height: 720px;
      overflow: hidden;
      background: #FFF1EC url('images/mv_bg_png.png') center / cover no-repeat;
      isolation: isolate;
    }
    .mv-inner {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      max-width: var(--wrap);
      height: 100%;
      margin: 0 auto;
      padding-left: 100px;
    }

    /* 장식 원 */
    .mv-ring {
      position: absolute;
      border-radius: 500px;
      pointer-events: none;
    }
    .mv-ring--glow {
      z-index: 1;
      width: 663px; height: 663px;
      left: 700px; top: 118px;
      background: radial-gradient(70.71% 70.71% at 50% 50%, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
      border: 5px solid var(--white);
      filter: blur(5px);
    }
    .mv-ring--line {
      z-index: 2;
      width: 553px; height: 553px;
      left: 755px; top: 173px;
      border: 1px solid rgba(255,255,255,0.5);
    }

    /* 비주얼 스테이지 (Figma Container 1689.6 x 844.8) */
    .mv-stage {
      position: absolute;
      z-index: 3;
      width: 1689.6px;
      height: 844.8px;
      right: -153px;
      top: calc(50% - 844.8px / 2);
      pointer-events: none;
    }
    .mv-stage > * { position: absolute; display: block; }
    .mv-stage img { object-fit: contain; }

    .mv-micro { width: 289.52px; height: 221.76px; left: 862.4px;  top: 124.08px; }
    .mv-char1 { width: 253.44px; height: 395.12px; left: 911.68px; top: 267.52px; }
    .mv-char2 { width: 181.28px; height: 381.04px; left: 1133.44px; top: 265.76px; }
    .mv-char3 { width: 216.48px; height: 262.24px; left: 836px;    top: 441.76px; }
    .mv-char4 { width: 292.16px; height: 206.8px;  left: 1192.4px; top: 462.88px; }

    /* 반짝이 별 (mv_star 에셋 미제공 → 인라인 SVG) */
    .mv-star--1 { width: 17.6px;  height: 16.72px; left: 1018.16px; top: 209.44px; color: #BFE6FF; }
    .mv-star--2 { width: 22.88px; height: 23.76px; left: 836.88px;  top: 441.76px; color: #A774F5; }
    .mv-star--3s { width: 21.12px; height: 21.12px; left: 1411.52px; top: 447.04px; color: #FFC62A; }
    .mv-star--3 { width: 34.32px; height: 35.2px;  left: 1429.12px; top: 404.8px;  color: #FFC62A; }
    .mv-star--4 { width: 23.76px; height: 24.64px; left: 1257.52px; top: 221.76px; color: #F2512B; }
    .mv-star svg { width: 100%; height: 100%; fill: currentColor; display: block; }

    /* 카피 영역 */
    .mv-copy {
      position: relative;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 560px;
      gap: 80px;
    }
    .mv-text { display: flex; flex-direction: column; align-items: flex-start; gap: 31.9px; width: 442px; }
    .mv-eyebrow {
      font-weight: 700;
      font-size: 31.1px;
      line-height: 45px;
      letter-spacing: -0.64px;
      white-space: nowrap;
    }
    .mv-title { display: flex; flex-direction: column; font-weight: 800; }
    .mv-title__em {
      font-size: 72.3px;
      line-height: 76px;
      letter-spacing: -1.76px;
      white-space: nowrap;
    }
    .mv-title__sub {
      font-size: 45.8px;
      line-height: 72px;
      letter-spacing: -1.12px;
      white-space: nowrap;
    }
    .mv-period {
      font-weight: 500;
      font-size: 19.2px;
      line-height: 28px;
      letter-spacing: -0.4px;
      white-space: nowrap;
    }

    /* 모집직무 바로가기 CTA (그라디언트는 transition 불가 → 오버레이 페이드로 반전) */
    .btn-cta {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 303px;
      max-width: 303px;
      height: 72px;
      padding: 18.7px 64px 19.3px;
      border-radius: 500px;
      background: linear-gradient(90deg, var(--red) 0%, var(--red-grad-end) 100%);
      color: var(--white);
      font-weight: 600;
      font-size: 22.7px;
      line-height: 34px;
      letter-spacing: -0.48px;
      white-space: nowrap;
      isolation: isolate;
      transition: color var(--ease);
    }
    .btn-cta::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background: var(--white);
      box-shadow: inset 0 0 0 2px var(--red);
      opacity: 0;
      transition: opacity var(--ease);
    }
    .btn-cta:hover { color: var(--red); }
    .btn-cta:hover::before { opacity: 1; }

    /* 스크롤 버튼 */
    .mv-scroll {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: 64px;
      width: 80px;
      height: 80px;
      margin-left: -40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 500px;
      background: rgba(255,255,255,0.1);
      box-shadow: inset 4px 4px 10px rgba(255,255,255,0.4), inset -4px -4px 10px rgba(0,0,0,0.1);
      -webkit-backdrop-filter: blur(5px);
      backdrop-filter: blur(5px);
      isolation: isolate;
      transition: background-color var(--ease);
    }
    .mv-scroll::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 2px;
      background: linear-gradient(132.3deg, rgba(255,255,255,0.8) 12.7%, rgba(255,255,255,0) 86.3%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
      mask-composite: exclude;
      pointer-events: none;
    }
    .mv-scroll:hover { background: rgba(255,255,255,0.35); }
    .mv-scroll svg { width: 40px; height: 40px; position: relative; z-index: 1; }
    .mv-scroll path { stroke: var(--white); transition: stroke var(--ease); }
    .mv-scroll:hover path { stroke: var(--red); }

    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }


    /* ===== Mirae Visual (메인 비주얼 다음 섹션) ===== */
    .mirae-visual {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 640px;
      height: min(760px, 100vh);
      overflow: hidden;
      background: linear-gradient(180deg, #fff 0%, #fff8f5 42%, #ffe9e2 100%);
    }
    .mirae-visual__title {
      position: relative;
      z-index: 3;
      margin: 0 auto;
      padding: clamp(92px, 10.2vw, 138px) 24px 0;
      width: 100%;
      text-align: center;
      font-size: clamp(34px, 4.85vw, 58px);
      line-height: 1.22;
      letter-spacing: -0.055em;
      font-weight: 800;
      white-space: nowrap;
      color: #ff4d36;
      background: linear-gradient(90deg, #ed0018 8%, #ff5b32 92%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .mirae-visual__art {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: -9%;
      width: min(70vw, 1040px);
      height: auto;
      transform: translateX(-50%);
      object-fit: contain;
    }
    .mirae-visual__cloud,
    .mirae-visual__star {
      position: absolute;
      display: block;
      height: auto;
      pointer-events: none;
      user-select: none;
    }
    .mirae-visual__cloud { z-index: 1; object-fit: contain; }
    .mirae-visual__cloud--left {
      left: -2.5%; top: 53%; width: clamp(130px, 16vw, 220px);
    }
    .mirae-visual__cloud--upper-left {
      left: 6%; top: 27%; width: clamp(130px, 22vw, 230px); opacity: .5; filter: blur(5px);
    }
    .mirae-visual__cloud--right {
      right: -3%; top: 27%; width: clamp(220px, 29vw, 340px);
    }
    .mirae-visual__cloud--small {
      right: 16%; top: 65%; width: clamp(70px, 9vw, 110px); opacity: .7; filter: blur(2px);
    }
    .mirae-visual__star { z-index: 3; }
    .mirae-visual__star--one { width: clamp(18px, 2vw, 28px); left: 57.5%; top: 37.5%; }
    .mirae-visual__star--two { width: clamp(23px, 2.7vw, 36px); left: 38%; top: 71%; }

    @media (max-width: 1024px) {
      .mirae-visual {
        min-height: 640px;
        height: 100vh;
        max-height: 760px;
      }
      .mirae-visual__title {
        padding-top: clamp(112px, 14.5vw, 136px);
        font-size: clamp(32px, 4.6vw, 42px);
      }
      .mirae-visual__art { width: min(68vw, 540px); bottom: -3%; }
      .mirae-visual__cloud--left { left: -4%; top: 61%; width: 18vw; min-width: 120px; }
      .mirae-visual__cloud--upper-left { left: 16%; top: 40%; width: 19vw; }
      .mirae-visual__cloud--right { right: -4%; top: 44%; width: 22vw; min-width: 180px; }
      .mirae-visual__cloud--small { right: 27%; top: 72%; width: 8vw; }
      .mirae-visual__star--one { left: 55%; top: 52%; }
      .mirae-visual__star--two { left: 41%; top: 76%; }
    }
    @media (max-width: 600px) {
      .mirae-visual {
        height: 763px;
        min-height: 700px;
        max-height: none;
      }
      .mirae-visual__title {
        padding: 112px 12px 0;
        font-size: clamp(30px, 7.6vw, 54px);
        letter-spacing: -0.06em;
      }
      .mirae-visual__art { width: 100%; max-width: 620px; bottom: -1%; }
      .mirae-visual__cloud--left { left: -8%; top: 53%; width: 25vw; min-width: 110px; }
      .mirae-visual__cloud--upper-left { left: 9%; top: 34%; width: 30vw; opacity: .42; }
      .mirae-visual__cloud--right { right: -9%; top: 31%; width: 39vw; min-width: 190px; }
      .mirae-visual__cloud--small { right: 8%; top: 66%; width: 14vw; min-width: 70px; }
      .mirae-visual__star--one { left: 58%; top: 57%; }
      .mirae-visual__star--two { left: 38%; top: 79%; }
    }
    @media (max-width: 380px) {
      .mirae-visual__title { font-size: 29px; }
    }
    /* ===== 모바일 전용 요소 (데스크탑/태블릿에서는 숨김) ===== */
    .btn-apply--top, .btn-menu, .menu-head { display: none; }
    html.is-menu-open, html.is-menu-open body { overflow: hidden; }

    /* 1440px 이하 데스크톱: 이미지와 좌표를 모두 viewport 단위로 바꿔 함께 축소 */
    @media (min-width: 1025px) and (max-width: 1439px) {
      .mv-stage {
        width: 117.333333vw;
        height: 58.666667vw;
        right: -10.625vw;
        top: calc(50% - 29.333333vw);
      }
      .mv-micro { width: 20.105556vw; height: 15.4vw; left: 59.888889vw; top: 8.616667vw; }
      .mv-char1 { width: 17.6vw; height: 27.438889vw; left: 63.311111vw; top: 18.577778vw; }
      .mv-char2 { width: 12.588889vw; height: 26.461111vw; left: 78.711111vw; top: 18.455556vw; }
      .mv-char3 { width: 15.033333vw; height: 18.211111vw; left: 58.055556vw; top: 30.677778vw; }
      .mv-char4 { width: 20.288889vw; height: 14.361111vw; left: 82.805556vw; top: 32.144444vw; }
      .mv-star--1 { width: 1.222222vw; height: 1.161111vw; left: 70.705556vw; top: 14.544444vw; }
      .mv-star--2 { width: 1.588889vw; height: 1.65vw; left: 58.116667vw; top: 30.677778vw; }
      .mv-star--3s { width: 1.466667vw; height: 1.466667vw; left: 98.022222vw; top: 31.044444vw; }
      .mv-star--3 { width: 2.383333vw; height: 2.444444vw; left: 99.244444vw; top: 28.111111vw; }
      .mv-star--4 { width: 1.65vw; height: 1.711111vw; left: 87.327778vw; top: 15.4vw; }
      .mv-ring--glow {
        width: 46.041667vw; height: 46.041667vw;
        left: 48.611111vw; top: 8.194444vw;
      }
      .mv-ring--line {
        width: 38.402778vw; height: 38.402778vw;
        left: 52.430556vw; top: 12.013889vw;
      }
    }

    /* =====================================================
       Tablet : 1024px 이하
       ===================================================== */
    @media (max-width: 1024px) {
      :root { --gnb-h: 70px; }
      body { min-width: 0; }

      /* Header */
      .header__inner { padding: 0 28px; }
      .logo, .logo img { width: 115px; height: 20px; }
      .gnb__list { gap: 23px; }
      .gnb__link,
      .gnb__item:first-child .gnb__link { font-size: 13.3px; line-height: 20px; letter-spacing: -0.28px; }
      .apply { padding-left: 17px; }
      .btn-apply { gap: 6px; width: 90px; height: 33px; padding: 0 12px; font-size: 12.1px; line-height: 18px; letter-spacing: -0.25px; }
      .btn-apply svg { width: 5px; height: 9px; }

      /* Main Visual : 텍스트 위 / 캐릭터 아래 세로 배치 */
      .main-visual { height: auto; min-height: 0; }
      .mv-inner { flex-direction: column; align-items: flex-start; height: auto; padding: 72px 30px 150px; }

      .mv-copy { width: 100%; gap: 28px; }
      .mv-text { width: 100%; gap: 16px; }
      .mv-eyebrow { font-size: 20.5px; line-height: 30px; letter-spacing: -0.4px; }
      .mv-title__em { font-size: 42.7px; line-height: 45px; letter-spacing: -1.05px; }
      .mv-title__sub { font-size: 26px; line-height: 41px; letter-spacing: -0.65px; }
      .mv-period { font-size: 14.5px; line-height: 22px; letter-spacing: -0.3px; }
      .btn-cta { width: 229px; max-width: 229px; height: 48px; padding: 0 20px; font-size: 15px; line-height: 22px; letter-spacing: -0.3px; }

      /* 장식 원은 캐릭터 그룹 기준으로 따라다니도록 stage 의사요소로 대체 */
      .mv-ring { display: none; }
      .mv-stage::before,
      .mv-stage::after {
        content: '';
        position: absolute;
        z-index: -1;
        left: 50%; top: 50%;
        aspect-ratio: 1;
        border-radius: 500px;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .mv-stage::before {
        width: 102.2%;
        background: radial-gradient(70.71% 70.71% at 50% 50%, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
        border: 5px solid var(--white);
        filter: blur(5px);
      }
      .mv-stage::after { width: 85.3%; border: 1px solid rgba(255,255,255,0.5); }

      /* 캐릭터 그룹: 데스크탑 비율(648.5 x 580)을 % 로 환산해 화면 폭에 따라 유동 */
      .mv-stage {
        position: relative;
        right: auto; top: auto;
        width: max(320px, 43vw);
        height: auto;
        aspect-ratio: 648.5 / 580;
        margin: 40px auto 0;
        order: 1; /* DOM 순서상 텍스트보다 앞이므로 아래로 배치 */
      }
      .mv-micro { width: 44.65%; height: 38.23%; left: 4.07%;  top: 0; }
      .mv-char1 { width: 39.08%; height: 68.12%; left: 11.67%; top: 24.73%; }
      .mv-char2 { width: 27.95%; height: 65.7%;  left: 45.87%; top: 24.43%; }
      .mv-char3 { width: 33.38%; height: 45.21%; left: 0;      top: 54.77%; }
      .mv-char4 { width: 45.05%; height: 35.66%; left: 54.96%; top: 58.41%; }
      .mv-star--1  { width: 2.71%; height: 2.88%; left: 28.09%; top: 14.72%; }
      .mv-star--2  { width: 3.53%; height: 4.1%;  left: 0.14%;  top: 54.77%; }
      .mv-star--3s { width: 3.26%; height: 3.64%; left: 88.75%; top: 55.68%; }
      .mv-star--3  { width: 5.29%; height: 6.07%; left: 91.46%; top: 48.4%; }
      .mv-star--4  { width: 3.66%; height: 4.25%; left: 65%;    top: 16.84%; }
    }

    /* =====================================================
       Mobile : 390px 이하
       ===================================================== */
    @media (max-width: 390px) {
      :root { --gnb-h: 66px; }

      /* Header : 로고 / 지원하기 / 햄버거 */
      .header__inner { padding: 0 18px; }
      .logo, .logo img { width: 131px; height: 22px; }

      .btn-apply--top {
        display: inline-flex;
        margin-left: auto;
        width: 64px; height: 28px;
        padding: 0;
        font-size: 12px; line-height: 18px; letter-spacing: -0.25px;
      }
      .btn-menu,
      .btn-close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px; height: 40px;
        color: var(--black);
        transition: color var(--ease);
      }
      .btn-menu { margin-right: -6px; }
      .btn-menu:hover, .btn-close:hover { color: var(--red); }
      .btn-menu svg, .btn-close svg { width: 20px; height: 20px; }

      /* 전체 메뉴 : 오른쪽에서 슬라이드 */
      .header__right {
        position: fixed;
        top: 0; right: 0;
        z-index: 20;
        flex-direction: column;
        align-items: stretch;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        background: var(--white);
        transform: translateX(100%);
        visibility: hidden;
        overflow-y: auto;
        transition: transform 0.3s ease, visibility 0s linear 0.3s;
      }
      .header__right.is-open {
        transform: translateX(0);
        visibility: visible;
        transition: transform 0.3s ease, visibility 0s;
      }
      .header__right::after {
        content: '';
        position: absolute;
        right: 14px; bottom: 14px;
        width: 170px;
        aspect-ratio: 277 / 313;
        background: url('images/mo_menu_char.png') center / contain no-repeat;
        pointer-events: none;
      }

      .menu-head {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: space-between;
        height: var(--gnb-h);
        padding: 0 12px 0 18px;
      }
      .gnb { flex: none; height: auto; padding: 34px 22px 0; }
      .gnb__list { flex-direction: column; gap: 0; height: auto; }
      .gnb__item { height: auto; border-bottom: 1px solid #EEE; }
      .gnb__link,
      .gnb__item:first-child .gnb__link { width: 100%; height: 68px; font-size: 22px; line-height: 28px; letter-spacing: -0.5px; }
      .apply { flex: none; padding: 40px 22px 0; }
      .apply .btn-apply { width: 100%; height: 56px; gap: 10px; font-size: 19px; line-height: 22px; letter-spacing: -0.4px; }
      .apply .btn-apply svg { width: 8px; height: 14px; }

      /* Main Visual */
      .mv-inner { padding: 103px 18px 70px; }
      .mv-copy { gap: 56px; }
      .mv-text { gap: 18px; }
      .mv-eyebrow { font-size: 20.4px; }
      .mv-title__em { font-size: 55.5px; line-height: 58px; letter-spacing: -1.35px; }
      .mv-title__sub { font-size: 35.7px; line-height: 56px; letter-spacing: -0.88px; }
      .mv-period { font-size: 12.5px; line-height: 20px; letter-spacing: -0.26px; }
      .btn-cta { width: 203px; max-width: 203px; height: 49px; }
      .mv-stage { width: 86vw; margin-top: 50px; }

      .mv-scroll { width: 40px; height: 40px; margin-left: -20px; bottom: 20px; }
      .mv-scroll svg { width: 20px; height: 20px; }
    }
  </style>
</head>
<body>

  <!-- 공통 SVG 스프라이트 : 4각 별 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="spark" viewBox="0 0 24 24">
      <path d="M12 0C12.7 7.2 16.8 11.3 24 12C16.8 12.7 12.7 16.8 12 24C11.3 16.8 7.2 12.7 0 12C7.2 11.3 11.3 7.2 12 0Z"/>
    </symbol>
  </svg>

  <header class="header">
    <div class="header__inner">
      <a class="logo" href="/" aria-label="한미그룹 공개채용 홈">
        <img src="images/기본.svg" alt="Hanmi 한미그룹" width="182" height="31">
      </a>

      <div class="header__right" id="gnbPanel">
        <!-- 모바일 전체메뉴 상단 (로고 + 닫기) -->
        <div class="menu-head">
          <a class="logo" href="/" aria-label="한미그룹 공개채용 홈">
            <img src="images/기본.svg" alt="Hanmi 한미그룹" width="182" height="31">
          </a>
          <button class="btn-close" type="button" id="menuClose" aria-label="전체 메뉴 닫기">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M3 3L17 17M17 3L3 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <nav class="gnb" aria-label="주요 메뉴">
          <ul class="gnb__list">
            <li class="gnb__item"><a class="gnb__link" href="#job">직무소개</a></li>
            <li class="gnb__item"><a class="gnb__link" href="#qualification">지원자격 및 접수방법</a></li>
            <li class="gnb__item"><a class="gnb__link" href="#schedule">채용설명회 일정</a></li>
          </ul>
        </nav>
        <div class="apply">
          <a class="btn-apply" href="#apply">
            지원하기
            <svg viewBox="0 0 7 12" fill="none" aria-hidden="true">
              <path d="M1 1L6 6L1 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>
      </div>

      <!-- 모바일 헤더 : 지원하기 + 햄버거 -->
      <a class="btn-apply btn-apply--top" href="#apply">지원하기</a>
      <button class="btn-menu" type="button" id="menuOpen" aria-label="전체 메뉴 열기" aria-expanded="false" aria-controls="gnbPanel">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M1 3.5H19M1 10H19M1 16.5H19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <section class="main-visual" id="main-visual" aria-label="메인 비주얼">
      <div class="mv-inner">

        <!-- 배경 장식 원 -->
        <div class="mv-ring mv-ring--glow" aria-hidden="true"></div>
        <div class="mv-ring mv-ring--line" aria-hidden="true"></div>

        <!-- 캐릭터 / 오브제 / 별 -->
        <div class="mv-stage">
          <img class="mv-micro" src="images/mv_micro_png.png" alt="" width="290" height="222">
          <img class="mv-char1" src="images/mv_char1_png.png" alt="연구복을 입고 플라스크를 든 파란색 캐릭터">
          <img class="mv-char2" src="images/mv_char2_png.png" alt="위생모와 마스크를 쓴 주황색 캐릭터">
          <img class="mv-char3" src="images/mv_char3_png.png" alt="서류가방을 든 보라색 캐릭터">
          <img class="mv-char4" src="images/mv_char4_png.png" alt="노트북 앞에 앉은 노란색 캐릭터">

          <span class="mv-star mv-star--1" aria-hidden="true"><svg><use href="#spark"/></svg></span>
          <span class="mv-star mv-star--2" aria-hidden="true"><svg><use href="#spark"/></svg></span>
          <span class="mv-star mv-star--3s" aria-hidden="true"><svg><use href="#spark"/></svg></span>
          <span class="mv-star mv-star--3" aria-hidden="true"><svg><use href="#spark"/></svg></span>
          <span class="mv-star mv-star--4" aria-hidden="true"><svg><use href="#spark"/></svg></span>
        </div>

        <!-- 텍스트 + CTA -->
        <div class="mv-copy">
          <div class="mv-text">
            <p class="mv-eyebrow">2026년 하반기</p>
            <h1 class="mv-title">
              <span class="mv-title__em">한미그룹</span>
              <span class="mv-title__sub">공개채용</span>
            </h1>
            <p class="mv-period">모집기간 : 2026.9.28(월) ~ 2026.10.18(일) 23:59까지</p>
          </div>
          <a class="btn-cta" href="#job">모집직무 바로가기!</a>
        </div>

        <!-- 아래로 스크롤 -->
        <button class="mv-scroll" type="button" id="scrollDown">
          <span class="sr-only">아래로 스크롤</span>
          <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <path d="M11 16L20 25L29 16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

      </div>
    </section>

    <!-- 메인 비주얼 다음 미래 비주얼 섹션 -->
    <section class="mirae-visual" aria-labelledby="mirae-visual-title">
      <h2 class="mirae-visual__title" id="mirae-visual-title">새로운 미래를 향해 나아갑니다</h2>
      <img class="mirae-visual__cloud mirae-visual__cloud--upper-left" src="images/mirae_cloud3.png" alt="" aria-hidden="true">
      <img class="mirae-visual__cloud mirae-visual__cloud--left" src="images/mirae_cloud1.png" alt="" aria-hidden="true">
      <img class="mirae-visual__cloud mirae-visual__cloud--right" src="images/mirae_cloud4.png" alt="" aria-hidden="true">
      <img class="mirae-visual__cloud mirae-visual__cloud--small" src="images/mirae_cloud2.png" alt="" aria-hidden="true">
      <img class="mirae-visual__star mirae-visual__star--one" src="images/mirae_star1.png" alt="" aria-hidden="true">
      <img class="mirae-visual__star mirae-visual__star--two" src="images/mirae_star2.png" alt="" aria-hidden="true">
      <img class="mirae-visual__art" src="images/mirae_walking.png" alt="푸른 캐릭터가 초록색 행성 위를 걸으며 새로운 미래를 향해 나아가는 모습">
    </section>
  </main>

  <script>
    (function () {
      var section = document.getElementById('main-visual');
      var btn = document.getElementById('scrollDown');

      // 모바일 전체메뉴: 열기/닫기 (오른쪽 슬라이드 + 배경 스크롤 잠금)
      var root = document.documentElement;
      var panel = document.getElementById('gnbPanel');
      var btnOpen = document.getElementById('menuOpen');
      var btnClose = document.getElementById('menuClose');
      var mq = window.matchMedia('(max-width: 390px)');

      function openMenu() {
        panel.classList.add('is-open');
        root.classList.add('is-menu-open');
        btnOpen.setAttribute('aria-expanded', 'true');
        btnClose.focus({ preventScroll: true });
      }
      function closeMenu() {
        if (!panel.classList.contains('is-open')) return;
        panel.classList.remove('is-open');
        root.classList.remove('is-menu-open');
        btnOpen.setAttribute('aria-expanded', 'false');
        if (mq.matches) btnOpen.focus({ preventScroll: true });
      }

      btnOpen.addEventListener('click', openMenu);
      btnClose.addEventListener('click', closeMenu);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeMenu();
      });
      // 모바일 구간을 벗어나면 메뉴 상태 초기화
      window.addEventListener('resize', function () {
        if (!mq.matches) closeMenu();
      });

      // 아래로 스크롤 버튼: 메인 비주얼 높이만큼 부드럽게 이동
      btn.addEventListener('click', function () {
        window.scrollTo({ top: section.offsetHeight, behavior: 'smooth' });
      });

      // 앵커 링크: 대상 섹션이 있으면 부드럽게 이동
      document.querySelectorAll('a[href^="#"]').forEach(function (a) {
        a.addEventListener('click', function (e) {
          closeMenu(); // 열려 있는 모바일 메뉴는 먼저 닫고(스크롤 잠금 해제) 이동
          var id = a.getAttribute('href');
          if (id.length < 2) return;
          var target = document.querySelector(id);
          if (target) {
            e.preventDefault();
            target.scrollIntoView({ behavior: 'smooth' });
          }
        });
      });
    })();
  </script>
</body>
</html>
